<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Submit a product review including rating, installation date, and useful features.">
    <meta name="author" content="Brighton Munezi">
    <title>Product Review Form | WDD 131</title>
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html" class="review-form">
            <p class="form-note"><span class="required-mark" aria-hidden="true">*</span> Indicates a required field</p>

            <!-- Product Name -->
            <div class="form-group">
                <label for="productName">Product Name <span class="required-mark" aria-hidden="true">*</span></label>
                <select id="productName" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <!-- Overall Rating -->
            <fieldset class="form-group">
                <legend>Overall Rating <span class="required-mark" aria-hidden="true">*</span></legend>
                <div class="rating-group">
                    <label for="rating1" class="rating-item">
                        <input type="radio" id="rating1" name="rating" value="1" required>
                        <span>&star;</span>
                    </label>
                    <label for="rating2" class="rating-item">
                        <input type="radio" id="rating2" name="rating" value="2" required>
                        <span>&star;&star;</span>
                    </label>
                    <label for="rating3" class="rating-item">
                        <input type="radio" id="rating3" name="rating" value="3" required>
                        <span>&star;&star;&star;</span>
                    </label>
                    <label for="rating4" class="rating-item">
                        <input type="radio" id="rating4" name="rating" value="4" required>
                        <span>&star;&star;&star;&star;</span>
                    </label>
                    <label for="rating5" class="rating-item">
                        <input type="radio" id="rating5" name="rating" value="5" required>
                        <span>&star;&star;&star;&star;&star;</span>
                    </label>
                </div>
            </fieldset>

            <!-- Date of Installation -->
            <div class="form-group">
                <label for="installDate">Date of Installation <span class="required-mark"
                        aria-hidden="true">*</span></label>
                <input type="date" id="installDate" name="installDate" required>
            </div>

            <!-- Useful Features -->
            <fieldset class="form-group">
                <legend>Which features did you find useful in the product? <span class="optional-tag">(Check all that
                        apply)</span></legend>
                <div class="checkbox-group">
                    <label for="featureDurability" class="checkbox-item">
                        <input type="checkbox" id="featureDurability" name="features" value="Durability">
                        Durability
                    </label>
                    <label for="featureEase" class="checkbox-item">
                        <input type="checkbox" id="featureEase" name="features" value="Ease of Use">
                        Ease of Use
                    </label>
                    <label for="featurePerformance" class="checkbox-item">
                        <input type="checkbox" id="featurePerformance" name="features" value="Performance">
                        Performance
                    </label>
                    <label for="featureDesign" class="checkbox-item">
                        <input type="checkbox" id="featureDesign" name="features" value="Design">
                        Design
                    </label>
                </div>
            </fieldset>

            <!-- Written Review -->
            <div class="form-group">
                <label for="writtenReview">Written Review <span class="optional-tag">(Optional)</span></label>
                <textarea id="writtenReview" name="writtenReview" rows="5"
                    placeholder="Share your experience with this product..."></textarea>
            </div>

            <!-- User Name -->
            <div class="form-group">
                <label for="full-name">Your Name <span class="optional-tag">(Optional)</span></label>
                <input type="text" id="full-name" name="full-name" placeholder="Brighton Munezi">
            </div>

            <!-- Submit Button -->
            <div class="form-group">
                <input type="submit" value="Post Review" class="submit-btn">
            </div>
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> | Brighton Munezi | Mutare, Zimbabwe</p>
        <p id="lastModified"></p>
    </footer>
</body>

</html>
